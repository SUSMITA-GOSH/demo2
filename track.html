<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Bus Tracker</title>
  <style>
    /* Fullscreen map */
    #map {
      height: 100vh;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

    // Your Firebase config (make sure it's the same as your project)
    const firebaseConfig = {
      apiKey: "AIzaSyCZNW0Oy75PzsvaP_25YZFSkyCpLmOjL7M",
      authDomain: "trackmybus-907b4.firebaseapp.com",
      projectId: "trackmybus-907b4",
      storageBucket: "trackmybus-907b4.appspot.com",
      messagingSenderId: "497112520163",
      appId: "1:497112520163:web:1cb3d59d912c16114dbcd6",
      databaseURL: "https://trackmybus-907b4-default-rtdb.firebaseio.com/"
    };

    // Initialize Firebase app and database
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Parse URL parameters for bus and student info
    const params = new URLSearchParams(window.location.search);
    const busId = params.get("busId");
    const busName = params.get("busName");
    const userLat = parseFloat(params.get("userLat"));
    const userLon = parseFloat(params.get("userLon"));

    if (!busId || !busName || isNaN(userLat) || isNaN(userLon)) {
      alert("Missing or invalid parameters. Please try tracking again.");
      throw new Error("Missing or invalid URL parameters.");
    }

    let map;
    let busMarker;
    let studentMarker;
    let infoWindow;

    window.initMap = () => {
      // Initialize the map centered roughly on student location
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: userLat, lng: userLon },
        zoom: 15,
      });

      infoWindow = new google.maps.InfoWindow();

      // Student marker (blue)
      studentMarker = new google.maps.Marker({
        position: { lat: userLat, lng: userLon },
        map,
        title: "Your Location",
        icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
      });

      // Bus marker (red) - will update live
      busMarker = new google.maps.Marker({
        map,
        title: busName,
        icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
      });

      // Listen for live bus location changes in Firebase
      const busRef = ref(db, `buses/${busId}`);
      onValue(busRef, (snapshot) => {
        const data = snapshot.val();
        if (!data || typeof data.latitude !== "number" || typeof data.longitude !== "number") {
          console.warn("Bus location data missing or invalid.");
          return;
        }

        const busPosition = { lat: data.latitude, lng: data.longitude };
        busMarker.setPosition(busPosition);

        // Adjust map bounds to show both student and bus markers
        const bounds = new google.maps.LatLngBounds();
        bounds.extend(busPosition);
        bounds.extend(studentMarker.getPosition());
        map.fitBounds(bounds);

        // Calculate ETA & distance using Google Maps Distance Matrix Service
        const service = new google.maps.DistanceMatrixService();
        service.getDistanceMatrix({
          origins: [busPosition],
          destinations: [studentMarker.getPosition()],
          travelMode: google.maps.TravelMode.DRIVING,
        }, (response, status) => {
          if (status === "OK") {
            const element = response.rows[0].elements[0];
            if (element.status === "OK") {
              const eta = element.duration.text;
              const dist = element.distance.text;
              infoWindow.setContent(`ETA: ${eta} (${dist})`);
              infoWindow.setPosition(busPosition);
              infoWindow.open(map, busMarker);
            } else {
              infoWindow.close();
              console.warn("No route found:", element.status);
            }
          } else {
            console.error("Distance Matrix Service failed:", status);
          }
        });
      });
    };
  </script>

  <!-- Load Google Maps JavaScript API with your key and callback -->
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCppQP7RlStK8E08kLliV2vE2Qhgu27em0&callback=initMap"
  ></script>
</body>
</html>
